<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ResumeMatch-AI</title>
  </head>
  <body>
    <h2>ResumeMatch-AI</h2>

    <div>
      <label>Resume Text</label><br />
      <textarea
        id="resume"
        rows="8"
        cols="80"
        placeholder="Paste resume text here..."
      ></textarea>
    </div>

    <br />

    <div>
      <label>Job Description</label><br />
      <textarea
        id="job"
        rows="8"
        cols="80"
        placeholder="Paste job description here..."
      ></textarea>
    </div>

    <br />

    <button onclick="analyze()">Analyze</button>

    <h3>Result</h3>
    <pre id="result"></pre>

    <script src="/static/app.js"></script>
  </body>
</html>
