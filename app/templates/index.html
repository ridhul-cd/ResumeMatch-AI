<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeMatch-AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ResumeMatch<span>.AI</span></h1>
            <p>Optimize your application with AI-powered skill gap analysis.</p>
        </header>

        <main class="card">
            <div class="input-group">
                <label for="resume">Resume Text</label>
                <textarea id="resume" placeholder="Paste the full text of the resume here..."></textarea>
            </div>

            <div class="input-group">
                <label for="job">Job Description</label>
                <textarea id="job" placeholder="Paste the job requirements here..."></textarea>
            </div>

            <button id="analyze-btn" onclick="analyze()">
                <span id="btn-text">Analyze Match</span>
                <div id="loader" class="hidden"></div>
            </button>
        </main>

        <section id="result-container" class="hidden">
            <h3>Analysis Report</h3>
            <div id="result" class="result-box"></div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
